{% extends 'base.html' %}

{% block content %}
    <section class="profile">
        <img src="{{ url_for('static', filename='samiVirjiPFP.jpg') }}" alt="Profile picture of {{ user.name }}" class="profile-picture">
        <h2>{{ user.name }}</h2>
        <span class="username">@{{ user.name }}</span>
        <button type="button" class="follow-button">Follow</button>
    </section>

    <section class="timeline">
        <h2>Latest posts by {{ user.name }}</h2>
        {% include 'posts_template.html' %}
    </section>
{% endblock %}
