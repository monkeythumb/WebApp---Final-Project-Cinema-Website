{% extends 'base.html' %}

{% block content %}
    <section class="current-user">
        <img src="{{ url_for('static', filename='samiVirjiPFP.jpg') }}" alt="Profile picture of Sami Virji" class="profile-picture">
        <h2>Sami Virji</h2>
        <span class="username">@samivirji</span>
    </section>

    <section class="new-post">
        <h2>Create a new post</h2>
        <form action="{{url_for('main.new_post')}}" method="post">
            <textarea name="text" rows="3" placeholder="What's on your mind?"></textarea>
            <button type="submit">Post</button>
        </form>
    </section>

    <section class="timeline">
        <h2>Latest posts from the people you follow</h2>
        {% include 'posts_template.html' %}
    </section>
{% endblock %}
